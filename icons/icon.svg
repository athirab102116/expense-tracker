<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="espressoGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#241E20"/>
      <stop offset="100%" stop-color="#141112"/>
    </radialGradient>
    <linearGradient id="champagneGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DEC0"/>
      <stop offset="50%" stop-color="#DFC498"/>
      <stop offset="100%" stop-color="#B89764"/>
    </linearGradient>
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5B09C"/>
      <stop offset="100%" stop-color="#D99B84"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Warm Espresso Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#espressoGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="128" fill="none" stroke="rgba(223, 196, 152, 0.22)" stroke-width="3"/>

  <!-- Subtle Inner Hairline Frame -->
  <rect x="40" y="40" width="432" height="432" rx="104" fill="none" stroke="rgba(223, 196, 152, 0.08)" stroke-width="1.5"/>

  <!-- Architectural Arch & Intertwined Crest Emblem in Champagne Gold -->
  <path d="M 160 360 V 220 C 160 166.975 202.975 124 256 124 C 309.025 124 352 166.975 352 220 V 360"
        fill="none" stroke="url(#champagneGold)" stroke-width="12" stroke-linecap="round"/>

  <!-- Horizontal Plinth Bar -->
  <line x1="136" y1="360" x2="376" y2="360" stroke="url(#champagneGold)" stroke-width="12" stroke-linecap="round"/>

  <!-- Inner Soft Terracotta Rose Orbit Ring -->
  <circle cx="256" cy="244" r="54" fill="none" stroke="url(#roseAccent)" stroke-width="8" opacity="0.95"/>

  <!-- Center Editorial Serif Rupee Monogram -->
  <text x="256" y="264"
        font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif"
        font-size="62" font-weight="600"
        fill="url(#champagneGold)"
        text-anchor="middle"
        letter-spacing="-1">₹</text>

  <!-- Subtle Corner Accents (Quiet Luxury Details) -->
  <circle cx="84" cy="84" r="3.5" fill="rgba(223, 196, 152, 0.4)"/>
  <circle cx="428" cy="84" r="3.5" fill="rgba(223, 196, 152, 0.4)"/>
  <circle cx="84" cy="428" r="3.5" fill="rgba(223, 196, 152, 0.4)"/>
  <circle cx="428" cy="428" r="3.5" fill="rgba(223, 196, 152, 0.4)"/>
</svg>
