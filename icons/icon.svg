<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1a73e8" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#1A73E8"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA4335"/>
      <stop offset="100%" stop-color="#D93025"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBC04"/>
      <stop offset="100%" stop-color="#F29900"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34A853"/>
      <stop offset="100%" stop-color="#188038"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base with Material Elevation -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="#E8EAED" stroke-width="4"/>

  <!-- Google 4-Color Geometric Flowing Card / Wallet Emblem -->
  <!-- Top Arc: Blue -->
  <path d="M 176 160 C 220 120, 292 120, 336 160 C 360 182, 368 214, 356 244 L 320 226 C 326 206, 320 186, 306 174 C 278 146, 234 146, 206 174 L 176 160 Z" fill="url(#blueGrad)"/>

  <!-- Right Arc: Red -->
  <path d="M 336 160 C 376 204, 376 276, 336 320 C 314 344, 282 352, 252 340 L 270 304 C 290 310, 310 304, 322 290 C 350 262, 350 218, 322 190 L 336 160 Z" fill="url(#redGrad)"/>

  <!-- Bottom Arc: Yellow -->
  <path d="M 336 320 C 292 360, 220 360, 176 320 C 152 298, 144 266, 156 236 L 192 254 C 186 274, 192 294, 206 306 C 234 334, 278 334, 306 306 L 336 320 Z" fill="url(#yellowGrad)"/>

  <!-- Left Arc: Green -->
  <path d="M 176 320 C 136 276, 136 204, 176 160 C 198 136, 230 128, 260 140 L 242 176 C 222 170, 202 176, 190 190 C 162 218, 162 262, 190 290 L 176 320 Z" fill="url(#greenGrad)"/>

  <!-- Center Card Emblem with Rupee Symbol -->
  <rect x="200" y="200" width="112" height="112" rx="28" fill="#1A73E8"/>
  <text x="256" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Google Sans', 'Roboto', sans-serif"
        font-size="64" font-weight="700" fill="#FFFFFF" text-anchor="middle">₹</text>
</svg>
