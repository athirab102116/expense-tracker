<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- PWA / iOS Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Expenses">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#FAF7F5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141112" media="(prefers-color-scheme: dark)">

  <title>Expenses &mdash; Personal Finance Dashboard</title>

  <!-- Editorial Quiet Luxury Fonts: Cormorant Garamond, Playfair Display & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Icons -->
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">

  <!-- Styles -->
  <link rel="stylesheet" href="css/app.css?v=84">
</head>
<body>
  <div id="app">
    <!-- Slide-over Backdrop for Mobile / Tablet drawer -->
    <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

    <!-- Collapsible Sidebar (Desktop & Mobile Drawer) -->
    <aside id="app-sidebar" class="app-sidebar" role="navigation" aria-label="Main sidebar navigation">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <img src="icons/icon.svg" width="32" height="32" alt="Expenses Logo" class="brand-logo">
          <div class="brand-text">
            <span class="brand-name">Expenses</span>
            <span class="brand-badge">Pro</span>
          </div>
        </div>
        <button id="sidebar-collapse-btn" class="sidebar-toggle-icon-btn" aria-label="Collapse sidebar" title="Toggle Sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
            <path d="M14 9l-3 3 3 3"></path>
          </svg>
        </button>
      </div>

      <!-- Quick Action: Primary + Add Transaction -->
      <div class="sidebar-quick-action">
        <button class="btn-sidebar-add" id="sidebar-add-btn" aria-label="Add transaction">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span class="nav-label">Add Transaction</span>
          <span class="sidebar-kbd">N</span>
        </button>
      </div>

      <!-- Navigation Links -->
      <nav class="sidebar-nav">
        <!-- Section: Expense Tracker -->
        <div class="sidebar-section-label">Expense Tracker</div>
        <button class="nav-item active" data-view="dashboard" aria-label="Dashboard" data-tooltip="Dashboard">
          <span class="nav-icon-wrap">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="9" rx="1.5"></rect>
              <rect x="14" y="3" width="7" height="5" rx="1.5"></rect>
              <rect x="14" y="12" width="7" height="9" rx="1.5"></rect>
              <rect x="3" y="16" width="7" height="5" rx="1.5"></rect>
            </svg>
          </span>
          <span class="nav-label">Dashboard</span>
        </button>

        <button class="nav-item" data-view="transactions" aria-label="Transactions" data-tooltip="Transactions">
          <span class="nav-icon-wrap">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
              <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
          </span>
          <span class="nav-label">Transactions</span>
        </button>

        <button class="nav-item" data-view="budgets" aria-label="Budgets" data-tooltip="Budgets">
          <span class="nav-icon-wrap">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <circle cx="12" cy="12" r="6"></circle>
              <circle cx="12" cy="12" r="2"></circle>
            </svg>
          </span>
          <span class="nav-label">Budgets</span>
        </button>

        <button class="nav-item" id="sidebar-sync-gmail-btn" aria-label="Sync Gmail" data-tooltip="Sync Gmail">
          <span class="nav-icon-wrap">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
          </span>
          <span class="nav-label">Sync Gmail</span>
        </button>

        <div class="sidebar-divider"></div>

        <!-- Section: Credit Card (Separate Section) -->
        <div class="sidebar-section-label">Credit Card</div>
        <button class="nav-item" data-view="cards" aria-label="Credit Cards" data-tooltip="Credit Cards">
          <span class="nav-icon-wrap">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="5" width="20" height="14" rx="2"></rect>
              <line x1="2" y1="10" x2="22" y2="10"></line>
            </svg>
          </span>
          <span class="nav-label">Credit Card</span>
        </button>

        <div class="sidebar-divider"></div>

        <!-- Section: Purchase Gatekeeper (Separate Section) -->
        <div class="sidebar-section-label">Gatekeeper</div>
        <button class="nav-item" data-view="gatekeeper" aria-label="Purchase Gatekeeper" data-tooltip="Purchase Gatekeeper">
          <span class="nav-icon-wrap">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
          </span>
          <span class="nav-label">Gatekeeper</span>
          <span class="nav-badge-pill" id="sidebar-gk-badge" style="display:none">0</span>
        </button>

        <div class="sidebar-divider"></div>

        <!-- Section: System -->
        <div class="sidebar-section-label">System</div>
        <button class="nav-item" data-view="settings" aria-label="Settings" data-tooltip="Settings">
          <span class="nav-icon-wrap">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </span>
          <span class="nav-label">Settings</span>
        </button>
      </nav>

      <!-- Sidebar Footer -->
      <div class="sidebar-footer">
        <button class="sidebar-tool-btn" id="open-import-sidebar" title="Import / Parse Bank Emails & Statements">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span class="nav-label">Import / Parse</span>
        </button>
        <div class="sidebar-footer-row">
          <button class="sfx-toggle" id="sfx-toggle" aria-label="Toggle sounds" title="Toggle audio cues">🔊</button>
          <span class="offline-badge" id="storage-status" title="Local Offline Storage Active">● Local</span>
        </div>
      </div>
    </aside>

    <!-- Main Workspace Container -->
    <div class="workspace-wrap">
      <!-- Top Production-Grade Header Bar -->
      <header class="top-header" role="banner">
        <div class="top-header-left">
          <button id="sidebar-toggle-btn" class="sidebar-hamburger-btn" aria-label="Toggle sidebar menu" title="Toggle Navigation">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div class="view-breadcrumb">
            <span class="breadcrumb-app">Expenses</span>
            <span class="breadcrumb-slash">/</span>
            <span class="breadcrumb-view" id="header-view-title">Dashboard</span>
          </div>
        </div>

        <div class="top-header-center">
          <!-- Month Switcher (accessible across all views) -->
          <div class="header-month-switcher" id="header-month-nav">
            <button class="month-pill-btn prev" id="header-prev-month" aria-label="Previous month" title="Previous Month">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <span class="header-month-label" id="header-month-label">March 2026</span>
            <button class="month-pill-btn next" id="header-next-month" aria-label="Next month" title="Next Month">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
            <button class="header-today-btn" id="header-today-btn" title="Jump to Current Month">Today</button>
          </div>
        </div>

        <div class="top-header-right">
          <button class="btn-header-secondary" id="header-gmail-sync-btn" title="Sync Bank Alerts from Gmail">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <span>Sync Gmail</span>
          </button>
          <button class="btn-header-secondary" id="header-import-btn" title="Import from Bank Emails, Statements, or Excel">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span>Import</span>
          </button>
          <button class="btn-header-primary" id="header-add-btn" title="Add New Transaction (N)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>New Transaction</span>
          </button>
        </div>
      </header>

      <!-- Main Content Views -->
      <main id="main-content" role="main" class="main-content-scroll">
        <div class="empty-state" style="padding-top:100px">
          <div style="margin-bottom:16px">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#DFC498" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
            </svg>
          </div>
          <div style="font-family:var(--font);font-size:16px;font-weight:600;color:var(--text3)">Loading Dashboard...</div>
        </div>
      </main>
    </div>

    <!-- Mobile Bottom Navigation (clean thumb bar on mobile screens) -->
    <nav class="mobile-bottom-nav" role="navigation" aria-label="Mobile Navigation">
      <button class="mobile-nav-item active" data-view="dashboard" aria-label="Expense Tracker Dashboard">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="9" rx="1.5"></rect>
          <rect x="14" y="3" width="7" height="5" rx="1.5"></rect>
          <rect x="14" y="12" width="7" height="9" rx="1.5"></rect>
          <rect x="3" y="16" width="7" height="5" rx="1.5"></rect>
        </svg>
        <span>Tracker</span>
      </button>

      <button class="mobile-nav-item" data-view="transactions" aria-label="Transactions Activity">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="8" y1="6" x2="21" y2="6"></line>
          <line x1="8" y1="12" x2="21" y2="12"></line>
          <line x1="8" y1="18" x2="21" y2="18"></line>
          <line x1="3" y1="6" x2="3.01" y2="6"></line>
          <line x1="3" y1="12" x2="3.01" y2="12"></line>
          <line x1="3" y1="18" x2="3.01" y2="18"></line>
        </svg>
        <span>Activity</span>
      </button>

      <button class="mobile-nav-item mobile-fab-item" id="mobile-quick-add" aria-label="Add transaction">
        <div class="mobile-fab">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </div>
      </button>

      <button class="mobile-nav-item" data-view="cards" aria-label="Credit Cards Section">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="5" width="20" height="14" rx="2"></rect>
          <line x1="2" y1="10" x2="22" y2="10"></line>
        </svg>
        <span>Credit Card</span>
      </button>

      <button class="mobile-nav-item" data-view="gatekeeper" aria-label="Gatekeeper Section">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        <span>Gatekeeper</span>
      </button>
    </nav>
  </div>

  <!-- Add / Edit Transaction Modal (global modal with Debit/Credit toggle) -->
  <div class="modal" id="add-modal">
    <div class="modal-sheet modal-sheet-lg">
      <div class="modal-handle"></div>
      <div id="add-modal-body"></div>
    </div>
  </div>

  <!-- Dedicated Import / Bank Email Parser Modal -->
  <div class="modal" id="import-modal">
    <div class="modal-sheet modal-sheet-xl">
      <div class="modal-handle"></div>
      <div id="import-modal-body"></div>
    </div>
  </div>

  <!-- Gmail Preview Modal -->
  <div class="modal" id="gmail-preview-modal">
    <div class="modal-sheet modal-sheet-xl">
      <div class="modal-handle"></div>
      <div id="gmail-preview-body"></div>
    </div>
  </div>

  <!-- Add / Edit Category Modal -->
  <div class="modal" id="cat-add-modal">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div id="cat-add-modal-body"></div>
    </div>
  </div>

  <!-- Category clarification modal -->
  <div class="modal" id="clarify-modal">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-title">Select Category</div>
      <p class="clarify-desc">
        <strong id="clarify-merchant"></strong> &mdash; <span id="clarify-amount"></span>
      </p>
      <p class="clarify-hint">Choose a category to remember for future transactions</p>
      <div id="clarify-cats" class="cat-grid"></div>
      <button class="btn-link clarify-skip" id="clarify-skip" style="margin-top:12px;width:100%;text-align:center">Skip for now</button>
    </div>
  </div>

  <!-- Credit Card Payment / Pay Off Modal -->
  <div class="modal" id="card-pay-modal">
    <div class="modal-sheet modal-sheet-md">
      <div class="modal-handle"></div>
      <div id="card-pay-modal-body"></div>
    </div>
  </div>

  <!-- Manage Credit Cards Modal -->
  <div class="modal" id="card-manage-modal">
    <div class="modal-sheet modal-sheet-md">
      <div class="modal-handle"></div>
      <div id="card-manage-modal-body"></div>
    </div>
  </div>

  <!-- Purchase Gatekeeper (Log Impulse) Modal -->
  <div class="modal" id="gatekeeper-modal">
    <div class="modal-sheet modal-sheet-lg">
      <div class="modal-handle"></div>
      <div id="gatekeeper-modal-body"></div>
    </div>
  </div>

  <!-- Google Identity Services (for Gmail OAuth) -->
  <script src="https://accounts.google.com/gsi/client"></script>
  <!-- Chart.js (bundled locally) -->
  <script src="lib/chart.umd.min.js"></script>
  <!-- GSAP 3 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <!-- App Entry -->
  <script type="module" src="js/app.js?v=84"></script>

  <!-- Service Worker registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=84')
          .then(r => {
            console.log('SW registered:', r.scope);
            r.update();
          })
          .catch(e => console.log('SW registration failed:', e));
      });
    }
  </script>
</body>
</html>
