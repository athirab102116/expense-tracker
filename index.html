<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- PWA / iOS Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Expenses">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">

  <title>Expenses</title>

  <!-- Google Sans / Roboto Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Icons -->
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">

  <!-- Styles -->
  <link rel="stylesheet" href="css/app.css?v=60">
</head>
<body>
  <div id="app">
    <main id="main-content" role="main">
      <!-- Views render here -->
      <div class="empty-state" style="padding-top:80px">
        <div style="font-size:48px;margin-bottom:16px">💳</div>
        <div>Loading Expenses...</div>
      </div>
    </main>

    <!-- Bottom Navigation / Sidebar -->
    <nav class="bottom-nav" role="navigation" aria-label="Main navigation">
      <div class="nav-brand">
        <img src="icons/icon.svg" width="30" height="30" alt="Expenses Logo" class="nav-brand-logo">
        <span class="nav-brand-name">Expenses</span>
      </div>
      <button class="nav-item active" data-view="dashboard" aria-label="Dashboard">
        <span class="nav-icon-wrap"><svg class="nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg></span>
        <span>Insights</span>
      </button>
      <button class="nav-item" data-view="transactions" aria-label="Transactions">
        <span class="nav-icon-wrap"><svg class="nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg></span>
        <span>Activity</span>
      </button>
      <button class="nav-item add-nav" data-view="add" aria-label="Add expense">
        <div class="m3-fab">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </div>
        <span class="m3-fab-label">Add</span>
      </button>
      <button class="nav-item" data-view="budgets" aria-label="Budgets">
        <span class="nav-icon-wrap"><svg class="nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span>
        <span>Budgets</span>
      </button>
      <button class="nav-item" data-view="settings" aria-label="Settings">
        <span class="nav-icon-wrap"><svg class="nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></span>
        <span>Settings</span>
      </button>
      <button class="sfx-toggle" id="sfx-toggle" aria-label="Toggle sounds" title="Toggle sounds">🔊</button>
    </nav>
  </div>

  <!-- Add / Edit Expense Modal (global, always present) -->
  <div class="modal" id="add-modal">
    <div class="modal-sheet modal-sheet-lg">
      <div class="modal-handle"></div>
      <div id="add-modal-body"></div>
    </div>
  </div>

  <!-- Import Expenses Modal (global, always present) -->
  <div class="modal" id="import-modal">
    <div class="modal-sheet modal-sheet-xl">
      <div class="modal-handle"></div>
      <div id="import-modal-body"></div>
    </div>
  </div>

  <!-- Gmail Preview Modal -->
  <div class="modal" id="gmail-preview-modal">
    <div class="modal-sheet modal-sheet-xl">
      <div class="modal-handle"></div>
      <div id="gmail-preview-body"></div>
    </div>
  </div>

  <!-- Add Category Modal -->
  <div class="modal" id="cat-add-modal">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div id="cat-add-modal-body"></div>
    </div>
  </div>

  <!-- Category clarification modal (global, always present) -->
  <div class="modal" id="clarify-modal">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-title">Select Category</div>
      <p class="clarify-desc">
        <strong id="clarify-merchant"></strong> &mdash; <span id="clarify-amount"></span>
      </p>
      <p class="clarify-hint">Choose a category to remember for future transactions</p>
      <div id="clarify-cats" class="cat-grid"></div>
      <button class="btn-link clarify-skip" id="clarify-skip" style="margin-top:12px;width:100%;text-align:center">Skip for now</button>
    </div>
  </div>

  <!-- Google Identity Services (for Gmail OAuth) — load synchronously so it's ready before any module JS -->
  <script src="https://accounts.google.com/gsi/client"></script>
  <!-- Chart.js (bundled locally) -->
  <script src="lib/chart.umd.min.js"></script>
  <!-- GSAP 3 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <!-- App -->
  <script type="module" src="js/app.js?v=60"></script>

  <!-- Service Worker registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=60')
          .then(r => console.log('SW registered:', r.scope))
          .catch(e => console.log('SW registration failed:', e));
      });
    }
  </script>
</body>
</html>
